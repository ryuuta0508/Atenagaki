<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>封筒宛名印刷システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 border-b pb-2">封筒宛名印刷設定</h1>
        <h2 class="text-sm font-semibold text-black-600 mb-2">スプレッドシートをサービスアカウント「atenagaki@atenagaki.iam.gserviceaccount.com」に共有するか、<br>一般的なアクセスを「リンクを知っている人全員」にしてください。</h2>
        <img class="fit-picture" src="{{ url_for('static', filename='image.png') }}"
        width="50%" height="50%"/>
        <!-- スプレッドシート情報 -->
        <div class="mb-6">
            <h2 class="text-sm font-bold text-gray-600 mb-2">1. Googleスプレッドシート設定</h2>
            <input type="text" id="spreadsheet_url" value="デバッグ用仮置きURL//docs.google.com/spreadsheets/d/1JkXjOgzII2-XkB6XUEBGyQ2w9g96jLkHyVfQb4BsIeA/edit?gid=0#gid=0" placeholder="スプレッドシートのURLを入力" class="w-full p-2 border rounded mb-2">
            <input type="text" id="sheet_name" value="シート1" placeholder="シート名 (例: Sheet1)" class="w-full p-2 border rounded">
        </div>

        <!-- 印刷範囲 -->
        <div class="mb-6">
            <h2 class="text-sm font-semibold text-gray-600 mb-2">2. 印刷範囲指定</h2>
            <div class="flex items-center gap-2">
                <input type="number" id="start_row" value="2" class="w-20 p-2 border rounded"> 行目から
                <input type="number" id="end_row" value="10" class="w-20 p-2 border rounded"> 行目まで
            </div>
        </div>

        <!-- 列指定 (col_map) -->
        <div class="mb-6">
            <h2 class="text-sm font-semibold text-gray-600 mb-2">3. 列の割り当て,半角アルファベット (A, B, C...)</h2>
            <div class="grid grid-cols-5 gap-2">
                <div>
                    <label class="block text-xs">氏名</label>
                    <input type="text" id="col_name" value="A" class="w-full p-2 border rounded uppercase text-center" placeholder="A">
                </div>
                <div>
                    <label class="block text-xs">住所</label>
                    <input type="text" id="col_address" value="B" class="w-full p-2 border rounded uppercase text-center" placeholder="B">
                </div>
                <div>
                    <label class="block text-xs">社名</label>
                    <input type="text" id="col_company" value="C" class="w-full p-2 border rounded uppercase text-center" placeholder="C">
                </div>
                <div>
                    <label class="block text-xs">部署</label>
                    <input type="text" id="col_department" value="D" class="w-full p-2 border rounded uppercase text-center" placeholder="D">
                </div>
                <div>
                    <label class="block text-xs">役職</label>
                    <input type="text" id="col_post" value="E" class="w-full p-2 border rounded uppercase text-center" placeholder="E">
                </div>
            </div>
        </div>

        <!-- 封筒・差出人 -->
        <div class="mb-6 bg-gray-100 p-4 rounded">
            <h2 class="text-sm font-semibold text-gray-600 mb-2">4. 印刷・レイアウト設定</h2>
            <select id="env_size" class="w-full p-2 border rounded mb-4">
                <option value="NAGA3">長形3号 (120 x 235mm)</option>
                <option value="KAKU2">角形2号 (240 x 332mm)</option>
            </select>

        <!-- 文字サイズ倍率 -->
        <div class="mb6 flex grid grid-cols-5">
            <div>
                <label class="block text-xs">文字サイズ倍率(%)</label>
                <input type="number" id="char_size_magni" value="100" class="w-full p-2 border text-center rounded" value="100" min="1" max="500">
            </div>
        </div>
        <div>
            
            <label class="flex items-center gap-2 mb-2">
                <input type="checkbox" id="show_sender" checked> 差出人を表示する
            </label>
            <textarea id="sender_info" class="w-full p-2 border rounded text-sm" rows="3">〒123-4567 東京都... 〇〇株式会社</textarea>
        </div>

        <button onclick="generatePDF()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
            PDFを生成してプレビュー
        </button>

        <div id="message_container" class="mt-8 hidden">
            <h2 class="text-2xl font-bold mb-6 border-b pb-2">PDF作成中・・・</h2>
        </div>

        <div id="preview_container" class="mt-8 hidden">
            <h2 class="text-sm font-semibold text-gray-600 mb-2">プレビュー (別画面で開く場合はブラウザの機能を使用してください)</h2>
            <iframe id="pdf_preview" class="w-full h-[1200px] border rounded shadow-inner"></iframe>
        </div>
    </div>

    <script>
        // アルファベットを数値に変換する関数 (A->0, B->1, AA->26...)
        function columnLetterToIndex(letter) {
            if (!letter) return 0;
            let column = 0;
            let str = letter.toUpperCase();
            for (let i = 0; i < str.length; i++) {
                column = column * 26 + (str.charCodeAt(i) - 64);
            }
            console.log(`DEBUG : ${letter} => ${column - 1}`)
            return column - 1; // 0-indexedにする
        }

        async function generatePDF() {
            console.log("DEBUG : index.html generatePDF");
            const messageContainer = document.getElementById('message_container');
            messageContainer.classList.remove('hidden');
            
            // document のスペルミスも修正済み
            const url = document.getElementById('spreadsheet_url').value;
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/); // 正規表現でIDを抽出
            const spreadsheetID = match ? match[1] : null;
            console.log(`DEBUG : \n url = ${url}\n match = ${match}\n spreadsheetID = ${spreadsheetID}`)
            if (!spreadsheetID) {
                alert("スプレッドシートのURLが正しくありません。");
                return;
            }

            const data = {
                spreadsheet_id: spreadsheetID,
                sheet_name: document.getElementById('sheet_name').value,
                start_row: parseInt(document.getElementById('start_row').value),
                end_row: parseInt(document.getElementById('end_row').value),
                col_map: {
                    // ここで変換関数を通す
                    name: columnLetterToIndex(document.getElementById('col_name').value),
                    address: columnLetterToIndex(document.getElementById('col_address').value),
                    company: columnLetterToIndex(document.getElementById('col_company').value),
                    department: columnLetterToIndex(document.getElementById('col_department').value),
                    post: columnLetterToIndex(document.getElementById('col_post').value)
                },
                env_size: document.getElementById('env_size').value,
                font_size_magnification: parseFloat(document.getElementById('char_size_magni').value),
                show_sender: document.getElementById('show_sender').checked,
                sender_info: document.getElementById('sender_info').value
            };

            // 以降の fetch 処理は同じ
            const response = await fetch('/fetch_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const previewContainer = document.getElementById('preview_container');
                const iframe = document.getElementById('pdf_preview');
                previewContainer.classList.remove('hidden');
                iframe.src = url; // iframeにPDFを表示
            } else {
                // 修正：サーバーから返ってきたエラーメッセージを表示する
                const errorData = await response.json();
                alert("エラーが発生しました: " + errorData.error);
            }
            messageContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
